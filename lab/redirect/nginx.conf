# OP-06D lab redirector (RC-44: Recon: report redirects to hostnames outside
# scope instead of going quiet).
#
# Answers every request on port 80 with 301 Location: http://site-outside.lab/.
# site-outside.lab resolves nowhere. Mounted read-only; the container's root
# filesystem is read-only too, so every writable path below is under the
# /tmp tmpfs.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log /dev/stdout;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    server {
        listen 80 default_server;
        server_name _;

        location / {
            return 301 http://site-outside.lab/;
        }
    }
}
