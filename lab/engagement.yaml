# OP-06D lab engagement (RC-19). Scoped ONLY to the two lab targets.
# This is a self-owned lab, not a client: the "authorization" below is the
# operator authorizing testing of their own isolated containers.
#
# Targets (see lab/docker-compose.yml):
#   juice-shop.lab / 172.31.77.10   (HTTP on 3000)
#   dvwa.lab       / 172.31.77.11   (HTTP on 80)
# The scanner itself (172.31.77.20) is explicitly OUT of scope.
