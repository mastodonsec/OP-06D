[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "op06d"
version = "0.0.1"
description = "AI-driven security validation — the model proposes, the gate disposes."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Pavan", email = "thomas@mastodonsec.com" }]
dependencies = ["pydantic>=2.5", "PyYAML>=6.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Operating System :: OS Independent",
]

[project.scripts]
op06d = "op06d.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
# RC-18: enables op06d.report_render.render_pdf via weasyprint. The alternative
# backend (Playwright + Chromium) is not listed here since it needs a separate
# `playwright install chromium` step beyond `pip install`; see
# report_render.NoPdfBackendAvailable for exact instructions for either.
report-pdf = ["weasyprint"]
# RC-40: LLM planner: wire a real model into the orchestrator and `op06d run`
llm-anthropic = ["anthropic>=2.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# RC-36: the bundled write-method exclusion list must ship with the package,
# or every nuclei run fails closed (method_exclusions_unavailable).
op06d = ["nuclei_write_method_exclusions.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# --basetemp keeps pytest's scratch in the repo (git-ignored), not %TEMP% on C:.
# A later --basetemp on the command line (e.g. /tmp/live-gate in the scanner) wins.
addopts = "-m 'not lab' --basetemp .pytest-tmp"
markers = [
    "lab: gated lab integration test (RC-20) - needs Docker/compose and OP06D_LAB=1; excluded by default",
]
