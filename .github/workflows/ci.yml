# SPDX-License-Identifier: AGPL-3.0-or-later
# Pull requests and pushes to main: the repository hygiene guard, the test
# suite, and an image build per architecture (built and checked, never pushed).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository hygiene guard
        run: python3 scripts/check_repo_hygiene.py

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.8.11"
          python-version: "3.11"
          enable-cache: false
      - name: Test suite
        run: uv run --frozen --extra dev pytest -q

  # docker/*requirements*.txt are generated from uv.lock and the setuptools pin.
  # A uv.lock change (e.g. from Dependabot) fails here until they are regenerated.
  requirements:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.8.11"
          python-version: "3.11"
          enable-cache: false
      - name: Generated requirement files match uv.lock
        run: python3 scripts/update_docker_requirements.py --check

  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: op06d:ci
          build-args: |
            REVISION=${{ github.sha }}
      - name: Check the image
        run: python3 scripts/check_image.py op06d:ci --platform ${{ matrix.platform }}
