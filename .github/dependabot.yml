# Dependabot updates the sources of truth only:
#
#   uv              pyproject.toml / uv.lock (the Python dependencies)
#   github-actions  the workflows' actions, pinned by commit SHA (Dependabot
#                   bumps the SHA and its version comment)
#   docker          the Dockerfile's base image digest (its FROM lines)
#
# The hash-pinned files under docker/ are generated from uv.lock and the
# setuptools pin, so the uv entry is told to skip docker/ (exclude-paths) and
# there is no pip entry. Every uv bump therefore fails CI's "requirements" job
# the same predictable way; the fix is always to run
#   uv run python scripts/update_docker_requirements.py
# on the Dependabot branch and commit the result with sign-off.
#
# pydantic pins pydantic-core exactly, so the two are grouped into one pull
# request, for version and security updates alike.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    exclude-paths: ["docker/**"]
    schedule:
      interval: weekly
    groups:
      pydantic:
        patterns: ["pydantic", "pydantic-core"]
      pydantic-security:
        applies-to: security-updates
        patterns: ["pydantic", "pydantic-core"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
